; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Use huge_app partition - single 3MB app partition for 4MB flash
board_build.partitions = huge_app.csv
; Pre-build script to generate version info
extra_scripts = pre:scripts/version_generator.py

lib_deps = https://github.com/amrikarisma/TFT_eSPI.git
    https://github.com/amrikarisma/esp32_can.git
	https://github.com/amrikarisma/can_common.git
	https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
build_flags =
    -D USER_SETUP_LOADED
    -D ILI9488_DRIVER
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=22
    -D TFT_RST=4
    -D XPT2046_CS=33
    -D XPT2046_IRQ=27
    -D XPT2046_CLK=14
    -D XPT2046_MISO=12
    -D XPT2046_MOSI=13
    -D LOAD_GLCD=1
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=27000000
    -D ENABLE_TOUCH=1
