; KMRTM35018-SPI - 3.5" ILI9488 with FT6236 Capacitive Touch (I2C)
[env:esp32dev-kmrtm35018]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_flags = 
    --no-stub
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/version_generator.py
lib_deps = 
    https://github.com/amrikarisma/TFT_eSPI.git
    https://github.com/amrikarisma/esp32_can.git
    https://github.com/amrikarisma/can_common.git
    https://github.com/amrikarisma/FT6236.git
build_flags =
    -D USER_SETUP_LOADED
    -D ILI9488_DRIVER
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=15
    -D TFT_DC=22
    -D TFT_RST=4
    -D LOAD_GLCD=1
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=27000000
    -D ENABLE_TOUCH=1
    -D USE_FT6236_TOUCH=1
    -D FT6236_SDA=33
    -D FT6236_SCL=13
    -D BUILD_DEFAULT_SPLASH=0  ; Mazduino splash

; TJM Splash Build
[env:esp32dev-tjm]
extends = env:esp32dev
build_flags = 
    ${env:esp32dev.build_flags}
    -D BUILD_DEFAULT_SPLASH=8  ; TJM splash

; GT Performance Splash Build
[env:esp32dev-gt]
extends = env:esp32dev
build_flags = 
    ${env:esp32dev.build_flags}
    -D BUILD_DEFAULT_SPLASH=9  ; GT Performance splash
; No Splash Build
[env:esp32dev-nosplash]
extends = env:esp32dev
build_flags = 
    ${env:esp32dev.build_flags}
    -D DISABLE_SPLASH=1  ; Skip splash screen completely